name: Local test laboratory definition
on: [push, pull_request, workflow_dispatch]
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/test-lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-core-reports
          path: artifacts/
  external-cpu-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python tools/fetch-full-testdata.py
      - run: python tools/test-lab.py --inventory-only --full
      - run: dotnet run --project SNESEmulator.Lab -c Release -- cpu-bus-full artifacts/bus-conformance testdata/65816-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-cpu-semantics
          path: artifacts/
  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/test-lab.py --windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-integration-reports
          path: artifacts/
